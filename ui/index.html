<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; frame-src 'none'">
  <title>ONE LINK</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="brand.css">
</head>
<body>
  <div class="brandbar">
    <img class="brandbar-icon" src="../assets/icon.png" alt="">
    <div class="wordmark" aria-label="ONE LINK">ONE <span>LINK</span></div>
    <span class="brand-tagline">Your devices. One connection.</span>
    <span class="brand-credit">ONE LINK <span>·</span> Unknown</span>
    <button class="about-button" data-action="about" aria-label="ONE LINK 정보" title="ONE LINK 정보">?</button>
  </div>
  <div class="app">
    <aside class="sidebar">
      <div class="workspace-brand"><span>나의 연결 공간</span><small>기기와 파일을 한곳에.</small></div>
      <div class="workspace-label">WORKSPACE</div>
      <nav aria-label="주 메뉴">
        <button data-nav="devices" class="nav-item active"><span>▦</span> 내 기기 <b id="device-count">0</b></button>
        <button data-nav="transfers" class="nav-item"><span>⇄</span> 전송 <b id="transfer-count">0</b></button>
        <button data-nav="shares" class="nav-item"><span>▱</span> 내 공유 폴더</button>
        <button data-nav="history" class="nav-item"><span>◷</span> 기록</button>
      </nav>
      <div class="sidebar-bottom"><div class="connection-pill"><i id="connection-dot"></i><div id="connection-label">연결 확인 중<small>기존 Tailscale 네트워크</small></div></div>
      <button data-nav="settings" class="nav-item"><span>⚙</span> 설정</button><div class="build-label">Unknown <span id="build-version">PREVIEW</span></div></div>
    </aside>
    <main>
      <header><div class="breadcrumb">내 작업 공간 <span>/</span> <strong id="page-label">내 기기</strong></div><div class="header-right"><span class="local-dot"></span><span id="local-name">이 기기</span><button id="refresh" class="icon-button" title="기기 새로고침" aria-label="기기 새로고침">↻</button></div></header>
      <div id="network-notice" class="notice hidden"></div>
      <div id="content"></div>
      <footer><span>파일은 연결된 기기 사이에서 전송됩니다.</span><span>© 2026 Unknown</span></footer>
    </main>
  </div>
  <div id="toast" role="status" class="toast hidden"></div>
  <dialog id="modal"><div id="modal-body"></div></dialog>
  <script src="app.js"></script>
</body>
</html>
